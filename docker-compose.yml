version: '3.9'

services:
  ai-document-reader:
    build: .
    container_name: ai-doc-reader
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=production
      - TESSDATA_PREFIX=/usr/share/tesseract-ocr/4.00/tessdata
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Uncomment for GPU support (requires nvidia-docker)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '1'
          memory: 256M

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: ai-doc-reader-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx_config.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - ai-document-reader
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: PostgreSQL for advanced deployments
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: ai-doc-reader-db
  #   environment:
  #     POSTGRES_USER: ai_reader
  #     POSTGRES_PASSWORD: your_secure_password
  #     POSTGRES_DB: documents
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ai_reader"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

# Named volumes for persistence
volumes:
  # postgres_data:
  #   driver: local

# Network configuration
networks:
  default:
    driver: bridge
